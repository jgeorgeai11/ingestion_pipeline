[project]
name = "ingpipe-lib"
version = "0.1.0"
description = "Shared library for the ingestion workspace: logging, env loading, SQL identifier validation, COMMENT ON builders, and the shared engine factory"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.1",
    "python-json-logger>=4.0.0",
    # ingpipe_lib.db (get_engine / require_extensions) is the workspace's
    # one engine factory and extension preflight; the driver rides with it so
    # an isolated install of the lib can actually connect.
    "sqlalchemy>=2.0.46",
    "psycopg2-binary>=2.9.11",
]

[project.optional-dependencies]
# ingpipe_lib.testing (the shared ephemeral_schema fixture) imports pytest;
# it is test-only, so the dependency is an extra rather than a runtime one.
testing = ["pytest>=9.0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
