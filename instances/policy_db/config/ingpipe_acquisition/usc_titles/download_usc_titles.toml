# Configuration for the acquisition engine, usc_titles source.
#
# Usage: uv run download-usc-titles \
#            --config instances/policy_db/config/ingpipe_acquisition/usc_titles/download_usc_titles.toml
#
# usc_titles needs no instance code: its URLs are COMPUTED from a release point
# and a list of title numbers, so the templated discoverer expresses the whole
# source and `download-usc-titles` is a console script pointing straight at
# `ingpipe_acquisition.runner:main`. The former download_usc_titles.py (a URL builder,
# a duplicated download_file, and a run loop) is deleted.
#
# There is no verify_ssl key. The old configs set it false and the script
# suppressed the resulting warning, against a host that serves a valid
# certificate -- the option existed only to disable a protection nobody needed
# disabled. No config in this repo can turn verification off any more.
#
# REFRESHING TO A NEW RELEASE POINT: edit the release point in `url_template`
# below. Note that the nine ingpipe_file_ingestion configs under
# config/ingpipe_file_ingestion/usc_titles/ also bake the release point into their
# document filenames and collection_path leaves, so a new release point still
# means editing those nine as well (a recorded, out-of-scope coupling).

output_dir = "data/input/usc_titles"

# All nine titles must resolve. A template that suddenly produces fewer targets
# means the values list was edited by accident, not that the corpus shrank.
min_targets = 9

request_delay_seconds = 2.0
dry_run = false
overwrite = false

[http]
retries = 3
backoff_factor = 0.5
timeout = 120.0

# uscode.house.gov zero-pads title numbers to two digits in the filename, so
# the values are authored as padded strings rather than TOML integers.
[discovery]
kind = "templated"
variable = "title"
values = ["05", "10", "20", "21", "25", "26", "29", "38", "42"]
url_template = "https://uscode.house.gov/download/releasepoints/us/pl/119/73not60/pdf_usc{title}@119-73not60.zip"
destination_template = "usc{title}/pdf_usc{title}@119-73not60.zip"
group_template = "usc{title}"

# Each title arrives as a zip holding one PDF. The PDF is the corpus content
# the ingpipe_file_ingestion configs read, so it -- not the archive -- is what the
# manifest records and the validator checks.
[extract]
enabled = true
keep = ["*.pdf"]
flatten = true
delete_archive = true
