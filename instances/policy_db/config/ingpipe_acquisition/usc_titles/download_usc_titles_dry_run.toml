# Dry-run configuration for the acquisition engine, usc_titles source.
#
# Usage: uv run download-usc-titles \
#            --config instances/policy_db/config/ingpipe_acquisition/usc_titles/download_usc_titles_dry_run.toml
#
# Resolves and logs every target without fetching anything and without writing
# a manifest. `min_targets` and the destination-escape check still run, so this
# preview fails loudly on a broken template instead of logging zero targets and
# exiting 0.
#
# min_targets is 1, not 9, because this config deliberately narrows to a single
# title: the floor states what THIS config expects to resolve.

output_dir = "data/input/usc_titles"
min_targets = 1
request_delay_seconds = 2.0
dry_run = true
overwrite = false

[http]
retries = 3
backoff_factor = 0.5
timeout = 120.0

[discovery]
kind = "templated"
variable = "title"
values = ["05"]
url_template = "https://uscode.house.gov/download/releasepoints/us/pl/119/73not60/pdf_usc{title}@119-73not60.zip"
destination_template = "usc{title}/pdf_usc{title}@119-73not60.zip"
group_template = "usc{title}"

[extract]
enabled = true
keep = ["*.pdf"]
flatten = true
delete_archive = true
