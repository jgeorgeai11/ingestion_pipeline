# qpp_cm 2024 cost-measure code lists — explicit-row ingest config.
# Generated from the workbooks (filter-cell/end-of-worksheet markers
# resolved to explicit row numbers). One config for the year listing all
# workbooks (matches the prior per-year qpp_cm pattern).

source_dir = "data/input/qpp_cm/2024/2024-cost-measure-codes-lists/"
db_name    = "policy_db"
db_schema  = "qpp_cm"

# Every derived collection_path is placed under this schema-scoped branch of
# the ltree tree. Without it each sheet's path is a bare `<stem>.<leaf>`
# (`2025_12_py2024_codes_list_aki.triggers`), so an MCP corpus filter of
# `qpp_cm.%` -- the natural way to scope a query to this schema -- matches NO
# sheet and silently drops the entire excel leg from the result. The 326 sheet
# entries below are deliberately left untouched: none authors a
# `collection_path` override, so every leaf stays machine-derived and the
# prefix applies uniformly.
#
# CHANGING THIS CHANGES EVERY SHEET'S IDENTITY. Rows already written under the
# old paths are not migrated, so the corpus rebuild that follows this activity
# is what puts the new identities in the database.
collection_path_prefix = "qpp_cm.2024_cost_measure_codes_lists"
overwrite  = false

# COMMENT ON descriptions applied at ingest (idempotent — refreshed on
# every run; surfaced by the MCP server's list_schemas / list_tables).
# NOTE: the per-sheet table_comment texts below were verified against the
# table columns and sample data; refine the QPP-specific semantics against
# the measure documentation where deeper precision is needed.
# Keep this text identical to the ingpipe-file-ingestion qpp_cm configs — last
# writer wins and both legs describe the same schema.
schema_comment = "CMS Quality Payment Program (QPP) cost-measure reference data — Cost Measure Information Form (MIF) documents, the consolidated source Excel workbooks, and structured per-measure lookup tables (codes, attribution, exclusions, service assignment, risk adjustment, triggers)"
sheet_table_comment = "Catalog of ingested qpp_cm cost-measure workbook sheets — one row per sheet, keyed by collection_path (an ltree of qpp_cm.<year>_cost_measure_codes_lists.<workbook>.<sheet>); holds title, n_rows, source_binary_hash, and the structured table the sheet also feeds"
content_table_comment = "Row-level text of every ingested qpp_cm workbook sheet — one row per spreadsheet row (collection_path, sort_order) rendered as newline key-value row_text over the ORIGINAL headers; this is the embedding leg, use the structured tables for exact code lookups"

