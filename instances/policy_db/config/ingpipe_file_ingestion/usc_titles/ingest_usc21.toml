# Configuration for ingest.py
#
# Usage: uv run ingest-files --config instances/policy_db/config/ingpipe_file_ingestion/usc_titles/ingest_usc21.toml --env-file instances/policy_db/.env

# Pipeline settings
overwrite = false

# Database target (top-level; consumed by the load step and the
# output validator)
db_name = "policy_db"
db_schema = "usc"

# Module — source files and metadata
[module]
source_dir = "data/input/usc_titles/usc21/"
documents = [
    { file = "usc21@119-73not60.pdf", title = "USC Title 21: Food and Drugs", collection_path = "usc.usc21.usc21_119_73not60" },
]

# Step 1: Parse — Convert source files to Docling JSON (the lossless format
# the clean step reads). No markdown is produced: the parse step's default
# output_formats is JSON only.
[parse]
run = true
parsed_dir = "data/parsed/usc_titles/usc21/"
# do_ocr and pdf_backend set the document-set defaults; either can be
# overridden per file by adding the same key to a [module].documents entry.
# do_ocr = false           # default: false; set true for scanned documents (OCR)
# pdf_backend = "dlparse"  # default: "dlparse"; alternative: "pypdfium2"

# Step 2: Clean — Parse Docling JSON into cleaned, db-ready sections JSON
[clean]
run = true
cleaned_dir = "data/cleaned/usc_titles/usc21/"

# Step 3: Load — Insert documents and sections into PostgreSQL
[load]
run = true
# document_table = "document"           # default: "document"
# content_table = "document_content"    # default: "document_content"

# COMMENT ON descriptions applied at load (idempotent — refreshed on
# every run; surfaced by the MCP server's list_schemas / list_tables).
schema_comment = "United States Code — ingested statutory titles (a subset of the Code), with section-level content and hybrid (semantic + keyword) search embeddings"
document_table_comment = "One row per ingested USC title PDF, keyed by collection_path (an ltree encoding the title number and chapter range); holds title, n_parsed_sections, source_binary_hash, ingested_at"
content_table_comment = "Full text content of each USC title split into sections — use for keyword search or reading statutory text"
