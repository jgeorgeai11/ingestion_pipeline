# Configuration for ingest.py
#
# Usage: uv run ingest-files --config instances/policy_db/config/ingpipe_file_ingestion/cms_iom/ingest_policy_pub_100_16.toml --env-file instances/policy_db/.env

# Pipeline settings
overwrite = false

# Database target (top-level; consumed by the load step and the
# output validator)
db_name = "policy_db"
db_schema = "cms_iom"

# Module — source files and metadata
[module]
source_dir = "data/input/cms_iom/2026-06-11/pub_100_16_managed_care/"
documents = [
