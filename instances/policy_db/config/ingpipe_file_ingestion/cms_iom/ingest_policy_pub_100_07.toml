# Configuration for ingest.py
#
# Usage: uv run ingest-files --config instances/policy_db/config/ingpipe_file_ingestion/cms_iom/ingest_policy_pub_100_07.toml --env-file instances/policy_db/.env

# Pipeline settings
overwrite = false

# Database target (top-level; consumed by the load step and the
# output validator)
db_name = "policy_db"
db_schema = "cms_iom"

# Module — source files and metadata
[module]
source_dir = "data/input/cms_iom/2026-06-11/pub_100_07_state_operations/"
documents = [
    { file = "chapter-9-exhibits-table-contents.pdf", title = "Pub. 100-07: State Operations Manual — Chapter 9 - Exhibits Table of Contents", collection_path = "cms_iom.pub_100_07_state_operations.chapter_9_exhibits_table_contents" },
    { file = "som-appendix.pdf", title = "Pub. 100-07: State Operations Manual — SOM Appendix", collection_path = "cms_iom.pub_100_07_state_operations.som_appendix" },
    { file = "som107c01pdf.pdf", title = "Pub. 100-07: State Operations Manual — Chapter 1 - Program Background and Responsibilities", collection_path = "cms_iom.pub_100_07_state_operations.som107c01pdf" },
    { file = "som107c02.pdf", title = "Pub. 100-07: State Operations Manual — Chapter 2 - The Certification Process", collection_path = "cms_iom.pub_100_07_state_operations.som107c02" },
    { file = "som107c03pdf.pdf", title = "Pub. 100-07: State Operations Manual — Chapter 3 - Additional Program Activities", collection_path = "cms_iom.pub_100_07_state_operations.som107c03pdf" },
    { file = "som107c04pdf.pdf", title = "Pub. 100-07: State Operations Manual — Chapter 4 - Program Administration and Fiscal Management", collection_path = "cms_iom.pub_100_07_state_operations.som107c04pdf" },
    { file = "som107c05pdf.pdf", title = "Pub. 100-07: State Operations Manual — Chapter 5 - Complaint Procedures", collection_path = "cms_iom.pub_100_07_state_operations.som107c05pdf" },
    { file = "som107c06pdf.pdf", title = "Pub. 100-07: State Operations Manual — Chapter 6 - Special Procedures for Laboratories", collection_path = "cms_iom.pub_100_07_state_operations.som107c06pdf" },
    { file = "som107c07pdf.pdf", title = "Pub. 100-07: State Operations Manual — Chapter 7 - Survey and Enforcement Process for Skilled Nursing Facilities and Nursing Facilities", collection_path = "cms_iom.pub_100_07_state_operations.som107c07pdf" },
    { file = "som107c08pdf.pdf", title = "Pub. 100-07: State Operations Manual — Chapter 8 - Standards and Certification", collection_path = "cms_iom.pub_100_07_state_operations.som107c08pdf" },
    { file = "som107c10.pdf", title = "Pub. 100-07: State Operations Manual — Chapter 10 - Informal Dispute Resolution and Enforcement Procedures for Home Health Agencies and Hospice Programs", collection_path = "cms_iom.pub_100_07_state_operations.som107c10" },
]

# Step 1: Parse — Convert source files to Docling JSON (the lossless format
# the clean step reads). No markdown is produced: the parse step's default
# output_formats is JSON only.
[parse]
run = true
parsed_dir = "data/parsed/cms_iom/2026-06-11/pub_100_07_state_operations/"
# do_ocr and pdf_backend set the document-set defaults; either can be
# overridden per file by adding the same key to a [module].documents entry.
# do_ocr = false           # default: false; set true for scanned documents (OCR)
# pdf_backend = "dlparse"  # default: "dlparse"; alternative: "pypdfium2"

# Step 2: Clean — Parse Docling JSON into cleaned, db-ready sections JSON
[clean]
run = true
cleaned_dir = "data/cleaned/cms_iom/2026-06-11/pub_100_07_state_operations/"

# Step 3: Load — Insert documents and sections into PostgreSQL
[load]
run = true
# document_table = "document"           # default: "document"
# content_table = "document_content"    # default: "document_content"

# COMMENT ON descriptions applied at load (idempotent — refreshed on
# every run; surfaced by the MCP server's list_schemas / list_tables).
schema_comment = "CMS Internet-Only Manuals — ingested policy documents stored as section-level text with hybrid (semantic + keyword) search embeddings"
document_table_comment = "One row per ingested CMS IOM chapter document (PDF or .docx), keyed by collection_path (an ltree of <schema>.<manual folder>.<chapter>); holds title, n_parsed_sections, source_binary_hash, ingested_at"
content_table_comment = "Section-level text of each CMS IOM chapter — one row per section (collection_path, sort_order) with heading_text, content_text, word_count, and page provenance; use for reading or keyword-filtering manual text"
