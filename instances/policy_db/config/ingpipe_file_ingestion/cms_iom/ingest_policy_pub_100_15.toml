# Configuration for ingest.py
#
# Usage: uv run ingest-files --config instances/policy_db/config/ingpipe_file_ingestion/cms_iom/ingest_policy_pub_100_15.toml --env-file instances/policy_db/.env

# Pipeline settings
overwrite = false

# Database target (top-level; consumed by the load step and the
# output validator)
db_name = "policy_db"
db_schema = "cms_iom"

# Module — source files and metadata
[module]
source_dir = "data/input/cms_iom/2026-06-11/pub_100_15_program_integrity/"
documents = [
    { file = "chapter-3-medicaid-investigations-audits.pdf", title = "Pub. 100-15: Medicaid Program Integrity — Chapter 3 - Medicaid Investigations & Audits", collection_path = "cms_iom.pub_100_15_program_integrity.chapter_3_medicaid_investigations_audits" },
    { file = "chapter-4-reporting-investigational-findings-making-referrals.pdf", title = "Pub. 100-15: Medicaid Program Integrity — Chapter 4 - Reporting Investigational Findings and Making Referrals", collection_path = "cms_iom.pub_100_15_program_integrity.chapter_4_reporting_investigational_findings_making_referrals" },
    { file = "chapter-5-unified-case-management-system.pdf", title = "Pub. 100-15: Medicaid Program Integrity — Chapter 5 - Unified Case Management System", collection_path = "cms_iom.pub_100_15_program_integrity.chapter_5_unified_case_management_system" },
    { file = "mpi115-appendices.pdf", title = "Pub. 100-15: Medicaid Program Integrity — Appendices", collection_path = "cms_iom.pub_100_15_program_integrity.mpi115_appendices" },
    { file = "mpi115c01.pdf", title = "Pub. 100-15: Medicaid Program Integrity — Chapter 1 - Authority, Background, and Definitions", collection_path = "cms_iom.pub_100_15_program_integrity.mpi115c01" },
    { file = "mpi115c02.pdf", title = "Pub. 100-15: Medicaid Program Integrity — Chapter 2 - Collaboration with States", collection_path = "cms_iom.pub_100_15_program_integrity.mpi115c02" },
]

# Step 1: Parse — Convert source files to Docling JSON (the lossless format
# the clean step reads). No markdown is produced: the parse step's default
# output_formats is JSON only.
[parse]
run = true
parsed_dir = "data/parsed/cms_iom/2026-06-11/pub_100_15_program_integrity/"
# do_ocr and pdf_backend set the document-set defaults; either can be
# overridden per file by adding the same key to a [module].documents entry.
# do_ocr = false           # default: false; set true for scanned documents (OCR)
# pdf_backend = "dlparse"  # default: "dlparse"; alternative: "pypdfium2"

# Step 2: Clean — Parse Docling JSON into cleaned, db-ready sections JSON
[clean]
run = true
cleaned_dir = "data/cleaned/cms_iom/2026-06-11/pub_100_15_program_integrity/"

# Step 3: Load — Insert documents and sections into PostgreSQL
[load]
run = true
# document_table = "document"           # default: "document"
# content_table = "document_content"    # default: "document_content"

# COMMENT ON descriptions applied at load (idempotent — refreshed on
# every run; surfaced by the MCP server's list_schemas / list_tables).
schema_comment = "CMS Internet-Only Manuals — ingested policy documents stored as section-level text with hybrid (semantic + keyword) search embeddings"
document_table_comment = "One row per ingested CMS IOM chapter document (PDF or .docx), keyed by collection_path (an ltree of <schema>.<manual folder>.<chapter>); holds title, n_parsed_sections, source_binary_hash, ingested_at"
content_table_comment = "Section-level text of each CMS IOM chapter — one row per section (collection_path, sort_order) with heading_text, content_text, word_count, and page provenance; use for reading or keyword-filtering manual text"
