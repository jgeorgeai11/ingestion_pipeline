# Configuration for ingest.py
#
# Usage: uv run ingest-files --config instances/policy_db/config/ingpipe_file_ingestion/cms_iom/ingest_policy_pub_100_06.toml --env-file instances/policy_db/.env

# Pipeline settings
overwrite = false

# Database target (top-level; consumed by the load step and the
# output validator)
db_name = "policy_db"
db_schema = "cms_iom"

# Module — source files and metadata
[module]
source_dir = "data/input/cms_iom/2026-06-11/pub_100_06_financial_management/"
documents = [
    { file = "chapter-12-instructions-medicare-credit-balance-report-activities.pdf", title = "Pub. 100-06: Medicare Financial Management — Chapter 12 - Instructions for Medicare Credit Balance Report Activities", collection_path = "cms_iom.pub_100_06_financial_management.chapter_12_instructions_medicare_credit_balance_report_activities" },
    { file = "fin106c01.pdf", title = "Pub. 100-06: Medicare Financial Management — Chapter 1 - Budget Preparation - Intermediaries and Carriers", collection_path = "cms_iom.pub_100_06_financial_management.fin106c01" },
    { file = "fin106c02.pdf", title = "Pub. 100-06: Medicare Financial Management — Chapter 2 - Budget Execution", collection_path = "cms_iom.pub_100_06_financial_management.fin106c02" },
    { file = "fin106c03.pdf", title = "Pub. 100-06: Medicare Financial Management — Chapter 3 - Overpayments", collection_path = "cms_iom.pub_100_06_financial_management.fin106c03" },
    { file = "fin106c04pdf.pdf", title = "Pub. 100-06: Medicare Financial Management — Chapter 4 - Debt Collection", collection_path = "cms_iom.pub_100_06_financial_management.fin106c04pdf" },
    { file = "fin106c05.pdf", title = "Pub. 100-06: Medicare Financial Management — Chapter 5 - Financial Reporting", collection_path = "cms_iom.pub_100_06_financial_management.fin106c05" },
    { file = "fin106c06.pdf", title = "Pub. 100-06: Medicare Financial Management — Chapter 6 - Medicare Administrator Contractor (MAC) Financial Reports", collection_path = "cms_iom.pub_100_06_financial_management.fin106c06" },
    { file = "fin106c07pdf.pdf", title = "Pub. 100-06: Medicare Financial Management — Chapter 7 - Internal Control Requirements", collection_path = "cms_iom.pub_100_06_financial_management.fin106c07pdf" },
    { file = "fin106c08.pdf", title = "Pub. 100-06: Medicare Financial Management — Chapter 8 - Contractor Procedures for Provider Audits", collection_path = "cms_iom.pub_100_06_financial_management.fin106c08" },
    { file = "fin106c09.pdf", title = "Pub. 100-06: Medicare Financial Management — Chapter 9 - Provider Statistical & Reimbursement Report", collection_path = "cms_iom.pub_100_06_financial_management.fin106c09" },
    { file = "fin106c10.pdf", title = "Pub. 100-06: Medicare Financial Management — Chapter 10 - Fee for Service Claims Administration Contractor and Workload Identification", collection_path = "cms_iom.pub_100_06_financial_management.fin106c10" },
]

# Step 1: Parse — Convert source files to Docling JSON (the lossless format
# the clean step reads). No markdown is produced: the parse step's default
# output_formats is JSON only.
[parse]
run = true
parsed_dir = "data/parsed/cms_iom/2026-06-11/pub_100_06_financial_management/"
# do_ocr and pdf_backend set the document-set defaults; either can be
# overridden per file by adding the same key to a [module].documents entry.
# do_ocr = false           # default: false; set true for scanned documents (OCR)
# pdf_backend = "dlparse"  # default: "dlparse"; alternative: "pypdfium2"

# Step 2: Clean — Parse Docling JSON into cleaned, db-ready sections JSON
[clean]
run = true
cleaned_dir = "data/cleaned/cms_iom/2026-06-11/pub_100_06_financial_management/"

# Step 3: Load — Insert documents and sections into PostgreSQL
[load]
run = true
# document_table = "document"           # default: "document"
# content_table = "document_content"    # default: "document_content"

# COMMENT ON descriptions applied at load (idempotent — refreshed on
# every run; surfaced by the MCP server's list_schemas / list_tables).
schema_comment = "CMS Internet-Only Manuals — ingested policy documents stored as section-level text with hybrid (semantic + keyword) search embeddings"
document_table_comment = "One row per ingested CMS IOM chapter document (PDF or .docx), keyed by collection_path (an ltree of <schema>.<manual folder>.<chapter>); holds title, n_parsed_sections, source_binary_hash, ingested_at"
content_table_comment = "Section-level text of each CMS IOM chapter — one row per section (collection_path, sort_order) with heading_text, content_text, word_count, and page provenance; use for reading or keyword-filtering manual text"
