# Configuration for ingest.py
#
# Usage: uv run ingest-files --config instances/policy_db/config/ingpipe_file_ingestion/cms_iom/ingest_policy_pub_100_01.toml --env-file instances/policy_db/.env

# Pipeline settings
overwrite = false

# Database target (top-level; consumed by the load step and the
# output validator)
db_name = "policy_db"
db_schema = "cms_iom"

# Module — source files and metadata
[module]
source_dir = "data/input/cms_iom/2026-06-11/pub_100_01_general_information_eligibility_and_entitlement/"
documents = [
    { file = "ge101c01.pdf", title = "Pub. 100-01: Medicare General Information, Eligibility, and Entitlement — Chapter 1 - General Overview", collection_path = "cms_iom.pub_100_01_general_information_eligibility_and_entitlement.ge101c01" },
    { file = "ge101c02.pdf", title = "Pub. 100-01: Medicare General Information, Eligibility, and Entitlement — Chapter 2 - Hospital Insurance and Supplementary Medical Insurance", collection_path = "cms_iom.pub_100_01_general_information_eligibility_and_entitlement.ge101c02" },
    { file = "ge101c03.pdf", title = "Pub. 100-01: Medicare General Information, Eligibility, and Entitlement — Chapter 3 - Deductibles, Coinsurance Amounts, and Payment Limitations", collection_path = "cms_iom.pub_100_01_general_information_eligibility_and_entitlement.ge101c03" },
    { file = "ge101c04.pdf", title = "Pub. 100-01: Medicare General Information, Eligibility, and Entitlement — Chapter 4 - Physician Certification and Recertification of Services", collection_path = "cms_iom.pub_100_01_general_information_eligibility_and_entitlement.ge101c04" },
    { file = "ge101c05.pdf", title = "Pub. 100-01: Medicare General Information, Eligibility, and Entitlement — Chapter 5 - Definitions", collection_path = "cms_iom.pub_100_01_general_information_eligibility_and_entitlement.ge101c05" },
    { file = "ge101c06.pdf", title = "Pub. 100-01: Medicare General Information, Eligibility, and Entitlement — Chapter 6 - Disclosure of Information", collection_path = "cms_iom.pub_100_01_general_information_eligibility_and_entitlement.ge101c06" },
    { file = "ge101c07.pdf", title = "Pub. 100-01: Medicare General Information, Eligibility, and Entitlement — Chapter 7 - Contract Administrative Requirements", collection_path = "cms_iom.pub_100_01_general_information_eligibility_and_entitlement.ge101c07" },
]

# Step 1: Parse — Convert source files to Docling JSON (the lossless format
# the clean step reads). No markdown is produced: the parse step's default
# output_formats is JSON only.
[parse]
run = true
parsed_dir = "data/parsed/cms_iom/2026-06-11/pub_100_01_general_information_eligibility_and_entitlement/"
# do_ocr and pdf_backend set the document-set defaults; either can be
# overridden per file by adding the same key to a [module].documents entry.
# do_ocr = false           # default: false; set true for scanned documents (OCR)
# pdf_backend = "dlparse"  # default: "dlparse"; alternative: "pypdfium2"

# Step 2: Clean — Parse Docling JSON into cleaned, db-ready sections JSON
[clean]
run = true
cleaned_dir = "data/cleaned/cms_iom/2026-06-11/pub_100_01_general_information_eligibility_and_entitlement/"

# Step 3: Load — Insert documents and sections into PostgreSQL
[load]
run = true
# document_table = "document"           # default: "document"
# content_table = "document_content"    # default: "document_content"

# COMMENT ON descriptions applied at load (idempotent — refreshed on
# every run; surfaced by the MCP server's list_schemas / list_tables).
schema_comment = "CMS Internet-Only Manuals — ingested policy documents stored as section-level text with hybrid (semantic + keyword) search embeddings"
document_table_comment = "One row per ingested CMS IOM chapter document (PDF or .docx), keyed by collection_path (an ltree of <schema>.<manual folder>.<chapter>); holds title, n_parsed_sections, source_binary_hash, ingested_at"
content_table_comment = "Section-level text of each CMS IOM chapter — one row per section (collection_path, sort_order) with heading_text, content_text, word_count, and page provenance; use for reading or keyword-filtering manual text"
