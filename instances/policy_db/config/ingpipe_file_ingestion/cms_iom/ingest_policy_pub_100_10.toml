# Configuration for ingest.py
#
# Usage: uv run ingest-files --config instances/policy_db/config/ingpipe_file_ingestion/cms_iom/ingest_policy_pub_100_10.toml --env-file instances/policy_db/.env

# Pipeline settings
overwrite = false

# Database target (top-level; consumed by the load step and the
# output validator)
db_name = "policy_db"
db_schema = "cms_iom"

# Module — source files and metadata
[module]
source_dir = "data/input/cms_iom/2026-06-11/pub_100_10_quality_improvement_organization/"
documents = [
    { file = "chapter-5-quality-care-review.pdf", title = "Pub. 100-10: Quality Improvement Organization Manual — Chapter 5 - Quality of Care Review", collection_path = "cms_iom.pub_100_10_quality_improvement_organization.chapter_5_quality_care_review" },
    { file = "qio110c01.pdf", title = "Pub. 100-10: Quality Improvement Organization Manual — Chapter 1 - Background and Responsibilities", collection_path = "cms_iom.pub_100_10_quality_improvement_organization.qio110c01" },
    { file = "qio110c03.pdf", title = "Pub. 100-10: Quality Improvement Organization Manual — Chapter 3 - Agreements", collection_path = "cms_iom.pub_100_10_quality_improvement_organization.qio110c03" },
    { file = "qio110c04.pdf", title = "Pub. 100-10: Quality Improvement Organization Manual — Chapter 4 - Case Review", collection_path = "cms_iom.pub_100_10_quality_improvement_organization.qio110c04" },
    { file = "qio110c07.pdf", title = "Pub. 100-10: Quality Improvement Organization Manual — Chapter 7 - Denials, Reconsiderations, Appeals", collection_path = "cms_iom.pub_100_10_quality_improvement_organization.qio110c07" },
    { file = "qio110c08.pdf", title = "Pub. 100-10: Quality Improvement Organization Manual — Chapter 8 - Infrastructure Operations Support and Data Management", collection_path = "cms_iom.pub_100_10_quality_improvement_organization.qio110c08" },
    { file = "qio110c09.pdf", title = "Pub. 100-10: Quality Improvement Organization Manual — Chapter 9 - Sanction and Abuse Issues", collection_path = "cms_iom.pub_100_10_quality_improvement_organization.qio110c09" },
    { file = "qio110c10.pdf", title = "Pub. 100-10: Quality Improvement Organization Manual — Chapter 10 - Confidentiality and Disclosure", collection_path = "cms_iom.pub_100_10_quality_improvement_organization.qio110c10" },
    { file = "qio110c12.pdf", title = "Pub. 100-10: Quality Improvement Organization Manual — Chapter 12 - Communications, Outreach and Program-related Information Activities", collection_path = "cms_iom.pub_100_10_quality_improvement_organization.qio110c12" },
    { file = "qio110c13.pdf", title = "Pub. 100-10: Quality Improvement Organization Manual — Chapter 13 - Management", collection_path = "cms_iom.pub_100_10_quality_improvement_organization.qio110c13" },
    { file = "qio110c15.pdf", title = "Pub. 100-10: Quality Improvement Organization Manual — Chapter 15 - Performance Evaluation", collection_path = "cms_iom.pub_100_10_quality_improvement_organization.qio110c15" },
    { file = "qio110c16.pdf", title = "Pub. 100-10: Quality Improvement Organization Manual — Chapter 16 - Health Care Quality Improvement Program", collection_path = "cms_iom.pub_100_10_quality_improvement_organization.qio110c16" },
]

# Step 1: Parse — Convert source files to Docling JSON (the lossless format
# the clean step reads). No markdown is produced: the parse step's default
# output_formats is JSON only.
[parse]
run = true
parsed_dir = "data/parsed/cms_iom/2026-06-11/pub_100_10_quality_improvement_organization/"
# do_ocr and pdf_backend set the document-set defaults; either can be
# overridden per file by adding the same key to a [module].documents entry.
# do_ocr = false           # default: false; set true for scanned documents (OCR)
# pdf_backend = "dlparse"  # default: "dlparse"; alternative: "pypdfium2"

# Step 2: Clean — Parse Docling JSON into cleaned, db-ready sections JSON
[clean]
run = true
cleaned_dir = "data/cleaned/cms_iom/2026-06-11/pub_100_10_quality_improvement_organization/"

# Step 3: Load — Insert documents and sections into PostgreSQL
[load]
run = true
# document_table = "document"           # default: "document"
# content_table = "document_content"    # default: "document_content"

# COMMENT ON descriptions applied at load (idempotent — refreshed on
# every run; surfaced by the MCP server's list_schemas / list_tables).
schema_comment = "CMS Internet-Only Manuals — ingested policy documents stored as section-level text with hybrid (semantic + keyword) search embeddings"
document_table_comment = "One row per ingested CMS IOM chapter document (PDF or .docx), keyed by collection_path (an ltree of <schema>.<manual folder>.<chapter>); holds title, n_parsed_sections, source_binary_hash, ingested_at"
content_table_comment = "Section-level text of each CMS IOM chapter — one row per section (collection_path, sort_order) with heading_text, content_text, word_count, and page provenance; use for reading or keyword-filtering manual text"
