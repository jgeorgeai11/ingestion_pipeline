    { file = "pace111c04.pdf", title = "Pub. 100-11: Programs of All-Inclusive Care for the Elderly (PACE) — Chapter 4 - Enrollment and Disenrollment", collection_path = "cms_iom.pub_100_11_programs_of_all_inclusive_care_for_the_elderly_pace_manual.pace111c04" },
    { file = "pace111c05.pdf", title = "Pub. 100-11: Programs of All-Inclusive Care for the Elderly (PACE) — Chapter 5 - Participant Rights and Restraint Policies", collection_path = "cms_iom.pub_100_11_programs_of_all_inclusive_care_for_the_elderly_pace_manual.pace111c05" },
