# Configuration for ingest.py
#
# Usage: uv run ingest-files --config instances/policy_db/config/ingpipe_file_ingestion/cms_iom/ingest_policy_pub_100_11.toml --env-file instances/policy_db/.env

# Pipeline settings
overwrite = false

# Database target (top-level; consumed by the load step and the
# output validator)
db_name = "policy_db"
db_schema = "cms_iom"

# Module — source files and metadata
[module]
source_dir = "data/input/cms_iom/2026-06-11/pub_100_11_programs_of_all_inclusive_care_for_the_elderly_pace_manual/"
documents = [
    { file = "pace111_app1.pdf", title = "Pub. 100-11: Programs of All-Inclusive Care for the Elderly (PACE) — Appendix 1", collection_path = "cms_iom.pub_100_11_programs_of_all_inclusive_care_for_the_elderly_pace_manual.pace111_app1" },
    { file = "pace111_toc.pdf", title = "Pub. 100-11: Programs of All-Inclusive Care for the Elderly (PACE) — Table of Contents", collection_path = "cms_iom.pub_100_11_programs_of_all_inclusive_care_for_the_elderly_pace_manual.pace111_toc" },
    { file = "pace111c01.pdf", title = "Pub. 100-11: Programs of All-Inclusive Care for the Elderly (PACE) — Chapter 1 - Introduction to PACE", collection_path = "cms_iom.pub_100_11_programs_of_all_inclusive_care_for_the_elderly_pace_manual.pace111c01" },
