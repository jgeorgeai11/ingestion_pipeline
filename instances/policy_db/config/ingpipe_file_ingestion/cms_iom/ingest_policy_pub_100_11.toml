    { file = "pace111c08.pdf", title = "Pub. 100-11: Programs of All-Inclusive Care for the Elderly (PACE) — Chapter 8 - IDT, Assessment & Care Planning", collection_path = "cms_iom.pub_100_11_programs_of_all_inclusive_care_for_the_elderly_pace_manual.pace111c08" },
    { file = "pace111c09.pdf", title = "Pub. 100-11: Programs of All-Inclusive Care for the Elderly (PACE) — Chapter 9 - Organization's Relationship with Health Care Providers", collection_path = "cms_iom.pub_100_11_programs_of_all_inclusive_care_for_the_elderly_pace_manual.pace111c09" },
