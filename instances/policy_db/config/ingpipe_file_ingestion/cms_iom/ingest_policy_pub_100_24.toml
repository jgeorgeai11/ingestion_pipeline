# Configuration for ingest.py
#
# Usage: uv run ingest-files --config instances/policy_db/config/ingpipe_file_ingestion/cms_iom/ingest_policy_pub_100_24.toml --env-file instances/policy_db/.env

# Pipeline settings
overwrite = false

# Database target (top-level; consumed by the load step and the
# output validator)
db_name = "policy_db"
db_schema = "cms_iom"

# Module — source files and metadata
[module]
source_dir = "data/input/cms_iom/2026-06-11/pub_100_24_state_payment_of_medicare_premiums/"
documents = [
    { file = "100-24-table-contents.pdf", title = "Pub. 100-24: State Buy-In (State Payment of Medicare Premiums) — Table of Contents", collection_path = "cms_iom.pub_100_24_state_payment_of_medicare_premiums.100_24_table_contents" },
    { file = "buyin_c03.pdf", title = "Pub. 100-24: State Buy-In (State Payment of Medicare Premiums) — Chapter 3 - Data Exchange", collection_path = "cms_iom.pub_100_24_state_payment_of_medicare_premiums.buyin_c03" },
    { file = "buyin_c05.pdf", title = "Pub. 100-24: State Buy-In (State Payment of Medicare Premiums) — Chapter 5 - Premium Billing", collection_path = "cms_iom.pub_100_24_state_payment_of_medicare_premiums.buyin_c05" },
    { file = "chapter-1-program-overview-and-policy.pdf", title = "Pub. 100-24: State Buy-In (State Payment of Medicare Premiums) — Chapter 1 - Program Overview and Policy", collection_path = "cms_iom.pub_100_24_state_payment_of_medicare_premiums.chapter_1_program_overview_and_policy" },
    { file = "chapter-2-data-exchange-processes.pdf", title = "Pub. 100-24: State Buy-In (State Payment of Medicare Premiums) — Chapter 2 - Data Exchange Processes", collection_path = "cms_iom.pub_100_24_state_payment_of_medicare_premiums.chapter_2_data_exchange_processes" },
    { file = "chapter-4-code-descriptions.pdf", title = "Pub. 100-24: State Buy-In (State Payment of Medicare Premiums) — Chapter 4 - Code Descriptions", collection_path = "cms_iom.pub_100_24_state_payment_of_medicare_premiums.chapter_4_code_descriptions" },
    { file = "chapter-6-problem-cases-and-resources.pdf", title = "Pub. 100-24: State Buy-In (State Payment of Medicare Premiums) — Chapter 6 - Problem Cases and Resources", collection_path = "cms_iom.pub_100_24_state_payment_of_medicare_premiums.chapter_6_problem_cases_and_resources" },
]

# Step 1: Parse — Convert source files to Docling JSON (the lossless format
# the clean step reads). No markdown is produced: the parse step's default
# output_formats is JSON only.
[parse]
run = true
parsed_dir = "data/parsed/cms_iom/2026-06-11/pub_100_24_state_payment_of_medicare_premiums/"
# do_ocr and pdf_backend set the document-set defaults; either can be
# overridden per file by adding the same key to a [module].documents entry.
# do_ocr = false           # default: false; set true for scanned documents (OCR)
# pdf_backend = "dlparse"  # default: "dlparse"; alternative: "pypdfium2"

# Step 2: Clean — Parse Docling JSON into cleaned, db-ready sections JSON
[clean]
run = true
cleaned_dir = "data/cleaned/cms_iom/2026-06-11/pub_100_24_state_payment_of_medicare_premiums/"

# Step 3: Load — Insert documents and sections into PostgreSQL
[load]
run = true
# document_table = "document"           # default: "document"
# content_table = "document_content"    # default: "document_content"

# COMMENT ON descriptions applied at load (idempotent — refreshed on
# every run; surfaced by the MCP server's list_schemas / list_tables).
schema_comment = "CMS Internet-Only Manuals — ingested policy documents stored as section-level text with hybrid (semantic + keyword) search embeddings"
document_table_comment = "One row per ingested CMS IOM chapter document (PDF or .docx), keyed by collection_path (an ltree of <schema>.<manual folder>.<chapter>); holds title, n_parsed_sections, source_binary_hash, ingested_at"
content_table_comment = "Section-level text of each CMS IOM chapter — one row per section (collection_path, sort_order) with heading_text, content_text, word_count, and page provenance; use for reading or keyword-filtering manual text"
