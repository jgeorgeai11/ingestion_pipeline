# Step 1: Parse — Convert source files to Docling JSON (the lossless format
# the clean step reads). No markdown is produced: the parse step's default
# output_formats is JSON only.
[parse]
run = true
parsed_dir = "data/parsed/qpp_cm/2025/2025-cost-measure-information-forms/"
# do_ocr and pdf_backend set the document-set defaults; either can be
# overridden per file by adding the same key to a [module].documents entry.
# do_ocr = false           # default: false; set true for scanned documents (OCR)
# pdf_backend = "dlparse"  # default: "dlparse"; alternative: "pypdfium2"

# Step 2: Clean — Parse Docling JSON into cleaned, db-ready sections JSON
[clean]
run = true
cleaned_dir = "data/cleaned/qpp_cm/2025/2025-cost-measure-information-forms/"

# Step 3: Load — Insert documents and sections into PostgreSQL
[load]
run = true
# document_table = "document"           # default: "document"
# content_table = "document_content"    # default: "document_content"

# COMMENT ON descriptions applied at load (idempotent — refreshed on
# every run; surfaced by the MCP server's list_schemas / list_tables).
schema_comment = "CMS Quality Payment Program (QPP) cost-measure reference data — Cost Measure Information Form (MIF) documents, the consolidated source Excel workbooks, and structured per-measure lookup tables (codes, attribution, exclusions, service assignment, risk adjustment, triggers)"
document_table_comment = "One row per ingested MIF (Cost Measure Information Form) PDF, keyed by collection_path (ltree); holds title, n_parsed_sections, source_binary_hash, ingested_at"
content_table_comment = "Section-level text of each MIF document — one row per section (collection_path, sort_order) with heading_text, content_text, word_count, and page provenance; use for reading or keyword-filtering narrative text"
